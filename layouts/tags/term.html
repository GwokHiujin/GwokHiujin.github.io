{{ define "main" }}
  <h1>#{{ .Data.Term }}</h1>

  {{ $entries := .Pages.ByDate.Reverse }}
  {{ if $entries }}
    <ul class="tag-posts">
      {{ range $entries }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{ end }}
    </ul>
  {{ else }}
    <p class="empty-state">这里什么也没有。</p>
  {{ end }}

  <div class="terminal-nav">
    <div class="back-nav"><a href="{{ `/tags/` | relURL }}" class="back-link">../</a></div>
  </div>
{{ end }}
