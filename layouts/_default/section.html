{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ with .Content }}
    <div class="category-intro">{{ . }}</div>
  {{ end }}

  {{ $entries := .Pages.ByDate.Reverse }}
  {{ if $entries }}
    <nav class="category-posts" aria-label="{{ .Title }} posts">
      <ul>
        {{ range $entries }}
          <li><a href="{{ .RelPermalink }}"><time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "2006-01-02" }}</time> {{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    </nav>
  {{ else }}
    <p class="empty-state">这里什么也没有。</p>
  {{ end }}

  <div class="terminal-nav">
    <div class="back-nav"><a href="{{ `/` | relURL }}" class="back-link">../</a></div>
  </div>
{{ end }}
