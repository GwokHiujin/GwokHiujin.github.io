<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="site-shell">
      <header role="banner">{{ partial "header.html" . }}</header>
      <main id="main-content" role="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
      <footer role="contentinfo">{{ partial "footer.html" . }}</footer>
    </div>
  </body>
</html>
